name: Playwright Regression Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test_execution:
    name: Run Automated Browser Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Execute Framework Tests
        run: npx playwright test tests/login.spec.ts --project=chromium
        env:
          CI: true

      - name: Archive Playwright Execution Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-execution-report
          path: playwright-report/
          retention-days: 14